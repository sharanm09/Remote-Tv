version: '3.8'

services:
  # Python Backend - Remote Control API
  python-backend:
    image: hemanth839/testbp:latest
    container_name: remote-control-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - remote-desktop-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js Backend - Mediasoup WebRTC Server
  node-backend:
    image: hemanth839/testbn:latest
    container_name: mediasoup-server
    ports:
      - "3001:3001"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    environment:
      - NODE_ENV=production
      - SERVER_IP=72.60.101.240
    restart: unless-stopped
    networks:
      - remote-desktop-network
    depends_on:
      - python-backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:3001/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend - Web UI
  frontend:
    image: hemanth839/testf:latest
    container_name: remote-desktop-ui
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    environment:
      - VITE_SERVER_URL=https://72.60.101.240:3001
    restart: unless-stopped
    networks:
      - remote-desktop-network
    depends_on:
      - node-backend
      - python-backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  remote-desktop-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  ssl-certs:
    driver: local


