# Coturn TURN server configuration for WebRTC

# Listener IP address
listening-ip=0.0.0.0

# External IP address (replace with your server's public IP)
external-ip=YOUR_SERVER_PUBLIC_IP

# Listener port for TURN
listening-port=3478

# TLS listening port
tls-listening-port=5349

# Minimum and maximum port range for relay
min-port=10000
max-port=20000

# Use fingerprints in the TURN messages
fingerprint

# Enable long-term credentials mechanism
lt-cred-mech

# User credentials format: username:password
user=turnuser:turnpassword

# Realm for authentication
realm=remote-camera-streaming

# Total allocation quota
total-quota=100

# Max bytes per session
bps-capacity=0

# Log file path
log-file=/var/log/turnserver.log

# Verbose mode (for debugging)
# verbose

# Enable WebRTC-friendly settings
no-multicast-peers
no-cli

# SSL/TLS certificate (uncomment and configure for production)
# cert=/path/to/cert.pem
# pkey=/path/to/key.pem

# Deny access to private IP ranges (recommended for security)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Allow loopback for local testing
# no-loopback-peers

# SQLite database for user management (optional)
# userdb=/var/db/turndb

# Mobility support
mobility

# Enable STUN
stun-only=false

