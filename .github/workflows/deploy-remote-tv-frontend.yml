name: Deploy Remote TV Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Copy frontend folder to VM
      - name: Upload frontend to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "frontend"
          target: "~/remote-tv/Remote-Tv"
          overwrite: true
          rm: true

      # 3️⃣ Build & run frontend container
      - name: Build & run frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_SHA
          script: |
            set -e

            echo "📁 Moving to frontend directory"
            cd ~/remote-tv/Remote-Tv/frontend

            echo "🛑 Removing old container (if exists)"
            docker rm -f remote-tv-frontend || true

            echo "🏗️ Building frontend image (no cache)"
            docker build --no-cache -t remote-tv-frontend:${GITHUB_SHA} .

            echo "🚀 Running frontend container"
            docker run -d \
              --name remote-tv-frontend \
              --restart unless-stopped \
              -p 3000:80 \
              remote-tv-frontend:${GITHUB_SHA}

            echo "🧹 Cleaning unused images"
            docker image prune -f

            echo "✅ Frontend deployment completed"
